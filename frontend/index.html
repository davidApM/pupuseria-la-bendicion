<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pupusería La Bendición - Menú Interactivo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #d35400;
            --primary-hover: #e67e22;
            --secondary-color: #f1c40f;
            --bg-color: #fcf8f2;
            --dark-color: #2c3e50;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: #333;
        }

        /* Navbar personalizado */
        .navbar-brand-custom {
            background: linear-gradient(135deg, #d35400, #c0392b);
            border-bottom: 4px solid var(--secondary-color);
        }

        /* Tarjetas de Selección y Contenido */
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            background: #ffffff;
            transition: all 0.3s ease;
        }

        /* Selector de Tipo de Masa */
        .btn-check:checked + .btn-masa-maiz {
            background-color: #f39c12 !important;
            color: #fff !important;
            border-color: #f39c12 !important;
            box-shadow: 0 4px 10px rgba(243, 156, 18, 0.4);
        }

        .btn-check:checked + .btn-masa-arroz {
            background-color: #27ae60 !important;
            color: #fff !important;
            border-color: #27ae60 !important;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.4);
        }

        .btn-masa {
            padding: 12px;
            font-weight: 600;
            border-radius: 12px !important;
            border: 2px solid #e0e0e0;
            transition: all 0.2s;
        }

        /* Tarjetas de Producto */
        .product-card {
            border-radius: 14px;
            border: 1px solid #f0e6df;
            background: #fff;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(211, 84, 0, 0.12);
            border-color: var(--primary-hover);
        }

        /* Carrito y Resumen */
        .cart-header {
            background-color: #fff5ed;
            border-bottom: 2px dashed #f5cba7;
            border-radius: 16px 16px 0 0;
        }

        .btn-primary-custom {
            background-color: var(--primary-color);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            transition: background 0.2s;
        }

        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            color: white;
        }

        .badge-masa {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            padding: 0;
            line-height: 28px;
            text-align: center;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <!-- Navegación Principal -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-brand-custom py-3 shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-utensils text-warning"></i>
                <span>Pupusería La Bendición</span>
            </a>
            <a href="cocina.html" class="btn btn-outline-light rounded-pill px-3 fw-semibold">
                <i class="fa-solid fa-fire-burner me-1"></i> Pantalla Cocina
            </a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4">

            <!-- COLUMNA IZQUIERDA: MENÚ DE PRODUCTOS -->
            <div class="col-lg-7">
                
                <!-- 1. Selección de Tipo de Masa -->
                <div class="card card-custom p-4 mb-4">
                    <h5 class="fw-bold mb-3 text-dark d-flex align-items-center gap-2">
                        <i class="fa-solid fa-wheat-awn text-warning"></i> 1. Elige el Tipo de Masa
                    </h5>
                    <div class="btn-group w-100 gap-2" role="group">
                        <input type="radio" class="btn-check" name="masa" id="masaMaiz" value="1" checked>
                        <label class="btn btn-masa btn-masa-maiz flex-fill" for="masaMaiz">
                            🌽 Masa de Maíz
                        </label>

                        <input type="radio" class="btn-check" name="masa" id="masaArroz" value="2">
                        <label class="btn btn-masa btn-masa-arroz flex-fill" for="masaArroz">
                            🌾 Masa de Arroz
                        </label>
                    </div>
                </div>

                <!-- 2. Catálogo de Productos -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold text-dark m-0 d-flex align-items-center gap-2">
                        <i class="fa-solid fa-book-open text-danger"></i> 2. Selecciona tus Menús
                    </h5>
                    <span class="badge bg-secondary rounded-pill px-3 py-2" id="total-productos-count">Cargando...</span>
                </div>

                <div id="contenedor-productos" class="row g-3">
                    <!-- Productos cargados dinámicamente -->
                </div>
            </div>

            <!-- COLUMNA DERECHA: RESUMEN DE ORDEN / CARRITO -->
            <div class="col-lg-5">
                <div class="card card-custom shadow-sm sticky-top" style="top: 20px;">
                    <div class="cart-header p-4">
                        <h4 class="fw-bold m-0 text-dark d-flex align-items-center gap-2">
                            <i class="fa-solid fa-basket-shopping text-danger"></i> Resumen de Orden
                        </h4>
                    </div>
                    
                    <div class="p-4">
                        <!-- Lista de Ítems -->
                        <ul id="lista-carrito" class="list-group list-group-flush mb-3">
                            <li class="list-group-item text-center text-muted py-4">
                                <i class="fa-solid fa-cart-flatbed fs-2 mb-2 text-secondary"></i>
                                <p class="mb-0">No has agregado productos aún</p>
                            </li>
                        </ul>

                        <hr class="text-muted opacity-25">

                        <!-- Formulario Datos Cliente -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-muted">Nombre del Cliente *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                                <input type="text" id="clienteNombre" class="form-control" placeholder="Ej. Doña María" required>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold small text-muted">Teléfono</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-phone text-muted"></i></span>
                                    <input type="text" id="clienteTelefono" class="form-control" placeholder="7000-0000">
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold small text-muted">Entrega</label>
                                <select id="tipoEntrega" class="form-select fw-semibold">
                                    <option value="A Domicilio">🛵 Domicilio</option>
                                    <option value="Para Llevar">🛍️ Para Llevar</option>
                                    <option value="En Local">🍽️ En Local</option>
                                </select>
                            </div>
                        </div>

                        <!-- Resumen Total -->
                        <div class="d-flex justify-content-between align-items-center my-4 p-3 bg-light rounded-3">
                            <span class="fs-5 fw-bold text-dark">Total a Pagar:</span>
                            <span class="fs-3 fw-bold text-success" id="totalTexto">$0.00</span>
                        </div>

                        <!-- Botón Enviar -->
                        <button class="btn btn-primary-custom btn-lg w-100 py-3 shadow" onclick="enviarPedido()">
                            <i class="fa-solid fa-paper-plane me-2"></i> Confirmar y Enviar a Cocina
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript Lógica -->
    <script>
        //const API_URL = 'http://localhost:3000/api';
        const API_URL = 'http://10.239.185.123:3000/api';
        let productosDisponibles = [];
        let carrito = [];

        async function cargarProductos() {
            try {
                const res = await fetch(`${API_URL}/productos`);
                productosDisponibles = await res.json();
                
                document.getElementById('total-productos-count').innerText = `${productosDisponibles.length} disponibles`;

                const contenedor = document.getElementById('contenedor-productos');
                contenedor.innerHTML = productosDisponibles.map(p => `
                    <div class="col-md-6">
                        <div class="card p-3 product-card h-100 d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex justify-content-between align-items-start mb-1">
                                    <h6 class="fw-bold text-dark m-0">${p.nombre}</h6>
                                    <span class="badge bg-warning text-dark fw-bold">$${parseFloat(p.precio).toFixed(2)}</span>
                                </div>
                                <p class="text-muted small mb-3">${p.descripcion || 'Especialidad de la casa'}</p>
                            </div>
                            <button class="btn btn-sm btn-primary-custom w-100 py-2" onclick="agregarAlCarrito(${p.id})">
                                <i class="fa-solid fa-plus me-1"></i> Agregar
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Error al cargar productos:", error);
                document.getElementById('contenedor-productos').innerHTML = `
                    <div class="col-12 alert alert-danger">
                        No se pudo conectar con el servidor. Verifica que el backend esté ejecutándose en http://localhost:3000
                    </div>`;
            }
        }

        function agregarAlCarrito(productoId) {
            const prod = productosDisponibles.find(p => p.id === productoId);
            const esPupusa = prod.categoria === 'Pupusas Tradicionales' || prod.categoria === 'Especialidades';
            const masaId = esPupusa ? parseInt(document.querySelector('input[name="masa"]:checked').value) : null;
            const masaNombre = esPupusa ? (masaId === 1 ? 'Maíz' : 'Arroz') : null;

            const item = carrito.find(i => i.producto_id === productoId && i.tipo_masa_id === masaId);
            if (item) {
                item.cantidad++;
            } else {
                carrito.push({
                    producto_id: prod.id,
                    nombre: prod.nombre,
                    precio_unitario: parseFloat(prod.precio),
                    tipo_masa_id: masaId,
                    tipo_masa_nombre: masaNombre,
                    cantidad: 1
                });
            }
            renderizarCarrito();
        }

        function cambiarCantidad(index, delta) {
            carrito[index].cantidad += delta;
            if (carrito[index].cantidad <= 0) {
                carrito.splice(index, 1);
            }
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const lista = document.getElementById('lista-carrito');
            let total = 0;

            if (carrito.length === 0) {
                lista.innerHTML = `
                    <li class="list-group-item text-center text-muted py-4">
                        <i class="fa-solid fa-cart-flatbed fs-2 mb-2 text-secondary"></i>
                        <p class="mb-0">No has agregado productos aún</p>
                    </li>`;
                document.getElementById('totalTexto').innerText = '$0.00';
                return;
            }

            lista.innerHTML = carrito.map((item, index) => {
                const subtotal = item.precio_unitario * item.cantidad;
                total += subtotal;
                const badgeMasa = item.tipo_masa_nombre 
                    ? `<span class="badge ${item.tipo_masa_nombre === 'Maíz' ? 'bg-warning text-dark' : 'bg-success'} badge-masa ms-1">${item.tipo_masa_nombre}</span>` 
                    : '';

                return `
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <div class="me-2">
                            <div class="fw-bold text-dark">${item.nombre} ${badgeMasa}</div>
                            <small class="text-muted">$${item.precio_unitario.toFixed(2)} c/u</small>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-secondary qty-btn" onclick="cambiarCantidad(${index}, -1)">-</button>
                                <span class="px-2 fw-bold align-self-center">${item.cantidad}</span>
                                <button class="btn btn-outline-secondary qty-btn" onclick="cambiarCantidad(${index}, 1)">+</button>
                            </div>
                            <span class="fw-bold text-dark ms-2" style="min-width: 50px; text-align: right;">$${subtotal.toFixed(2)}</span>
                        </div>
                    </li>
                `;
            }).join('');

            document.getElementById('totalTexto').innerText = `$${total.toFixed(2)}`;
        }

        async function enviarPedido() {
            const cliente = document.getElementById('clienteNombre').value;
            const telefono = document.getElementById('clienteTelefono').value;
            const tipo_entrega = document.getElementById('tipoEntrega').value;

            if (!cliente.trim()) return alert('Por favor escribe el nombre del cliente');
            if (carrito.length === 0) return alert('El carrito está vacío');

            const total = carrito.reduce((sum, item) => sum + (item.precio_unitario * item.cantidad), 0);

            try {
                const respuesta = await fetch(`${API_URL}/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cliente, telefono, tipo_entrega, total, items: carrito })
                });

                if (respuesta.ok) {
                    alert('¡Pedido enviado al área de comales con éxito!');
                    carrito = [];
                    document.getElementById('clienteNombre').value = '';
                    document.getElementById('clienteTelefono').value = '';
                    renderizarCarrito();
                } else {
                    alert('Error al procesar el pedido. Intenta nuevamente.');
                }
            } catch (error) {
                console.error("Error al enviar pedido:", error);
                alert('No se pudo conectar con el servidor.');
            }
        }

        cargarProductos();
    </script>
</body>
</html>
