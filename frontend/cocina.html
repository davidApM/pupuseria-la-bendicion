<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla Comales - Pupusería La Bendición</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Estilos Externos -->
    <link rel="stylesheet" href="css/cocina.css">
</head>
<body class="pb-5">

    <!-- Encabezado de la Pantalla -->
    <div class="kds-header d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-3">
            <h2 class="fw-bold m-0 text-warning">
                <i class="fa-solid fa-fire-burner me-2"></i> COMALES EN VIVO
            </h2>
            <span class="badge bg-danger fs-6" id="contador-pendientes">0 Pedidos</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-outline-warning btn-sm fw-bold" onclick="reproducirSonidoPrueba()">
                <i class="fa-solid fa-volume-high me-1"></i> Probar Audio
            </button>
            <a href="index.html" class="btn btn-outline-light btn-sm fw-bold">
                <i class="fa-solid fa-arrow-left me-1"></i> Ir al Menú
            </a>
        </div>
    </div>

    <div class="container-fluid px-4">
        <div id="contenedor-comandas" class="row g-4">
            <!-- Comandas dinámicas -->
        </div>
    </div>

    <!-- Script Lógica Externa -->
    <script src="js/cocina.js"></script>
</body>
</html>
